name: Update solved.ac Stats

on:
  schedule:
    # 매일 오전 9시(KST)에 실행 (UTC 0시)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 옵션

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Get solved.ac user info and problem stats
        id: solvedac
        run: |
          python3 << 'PYEOF'
          import requests
          import os
          from datetime import datetime

          BOJ_USERNAME = "rladydgnj"

          HEADERS = {
              "User-Agent": "github-actions/solvedac-readme-updater",
              "Accept": "application/json",
          }

          # 사용자 정보 가져오기
          res = requests.get(
              f"https://solved.ac/api/v3/user/show?handle={BOJ_USERNAME}",
              headers=HEADERS
          )
          user = res.json()

          tier = user["tier"]
          solved_count = user["solvedCount"]
          rank = user["rank"]

          # 티어 이름 매핑
          tier_names = [
              "Unrated",
              "Bronze V", "Bronze IV", "Bronze III", "Bronze II", "Bronze I",
              "Silver V", "Silver IV", "Silver III", "Silver II", "Silver I",
              "Gold V",   "Gold IV",   "Gold III",   "Gold II",   "Gold I",
              "Platinum V", "Platinum IV", "Platinum III", "Platinum II", "Platinum I",
              "Diamond V",  "Diamond IV",  "Diamond III",  "Diamond II",  "Diamond I",
              "Ruby V",   "Ruby IV",   "Ruby III",   "Ruby II",   "Ruby I",
              "Master"
          ]
          tier_name = tier_names[tier] if tier < len(tier_names) else "Unknown"

          date = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          # 티어별 문제 수 집계
          counts = {"bronze": 0, "silver": 0, "gold": 0, "platinum": 0, "diamond": 0, "ruby": 0}
          page = 1
          total = 0

          while True:
              r = requests.get(
                  f"https://solved.ac/api/v3/search/problem?query=solved_by:{BOJ_USERNAME}&page={page}",
                  headers=HEADERS
              )
              data = r.json()
              items = data.get("items", [])
              count_total = data.get("count", 0)

              if not items:
                  break

              for item in items:
                  lv = item.get("level", 0)
                  if 1 <= lv <= 5:    counts["bronze"]   += 1
                  elif 6 <= lv <= 10:  counts["silver"]   += 1
                  elif 11 <= lv <= 15: counts["gold"]     += 1
                  elif 16 <= lv <= 20: counts["platinum"] += 1
                  elif 21 <= lv <= 25: counts["diamond"]  += 1
                  elif 26 <= lv <= 31: counts["ruby"]     += 1

              total += len(items)
              if total >= count_total:
                  break
              page += 1

          total_by_tier = sum(counts.values())

          # GitHub Output 저장
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"username={BOJ_USERNAME}\n")
              f.write(f"tier_name={tier_name}\n")
              f.write(f"solved_count={solved_count}\n")
              f.write(f"rank={rank}\n")
              f.write(f"date={date}\n")
              f.write(f"bronze_count={counts['bronze']}\n")
              f.write(f"silver_count={counts['silver']}\n")
              f.write(f"gold_count={counts['gold']}\n")
              f.write(f"platinum_count={counts['platinum']}\n")
              f.write(f"diamond_count={counts['diamond']}\n")
              f.write(f"ruby_count={counts['ruby']}\n")
              f.write(f"total_by_tier={total_by_tier}\n")

          print(f"완료: {tier_name} / {solved_count}문제 / 랭킹 {rank}위")
          PYEOF

      - name: Create complete README
        run: |
          # 전체 README 내용 생성
          cat > README.md << EOL
          # 백준 알고리즘 문제 풀이 저장소

          이 저장소는 백준 온라인 저지의 알고리즘 문제 풀이를 기록하고 공유하기 위한 곳입니다.

          ## 📊 solved.ac 통계
          > 마지막 업데이트: ${{ steps.solvedac.outputs.date }}

          [![solved.ac 프로필](https://mazassumnida.wtf/api/v2/generate_badge?boj=rladydgnj)](https://solved.ac/profile/rladydgnj)

          ### 기본 정보
          - 티어: ${{ steps.solvedac.outputs.tier_name }}
          - 해결한 문제 수: ${{ steps.solvedac.outputs.solved_count }}개
          - 랭킹: ${{ steps.solvedac.outputs.rank }}위

          ## 🚀 진행 상황
          | 난이도 | 해결한 문제 수 |
          |:-------:|:-------:|
          | 브론즈 | ${{ steps.solvedac.outputs.bronze_count }}문제 |
          | 실버 | ${{ steps.solvedac.outputs.silver_count }}문제 |
          | 골드 | ${{ steps.solvedac.outputs.gold_count }}문제 |
          | 플래티넘 | ${{ steps.solvedac.outputs.platinum_count }}문제 |
          | 다이아몬드 | ${{ steps.solvedac.outputs.diamond_count }}문제 |
          | 루비 | ${{ steps.solvedac.outputs.ruby_count }}문제 |
          | **합계** | **${{ steps.solvedac.outputs.total_by_tier }}문제** |

          ## 🎯 소개
          백준 온라인 저지에서 제공하는 다양한 알고리즘 문제들을 풀고 해당 풀이 코드를 저장하는 공간입니다. 알고리즘 학습과 코딩 테스트 준비를 위한 개인 기록용으로 사용됩니다.

          ## 📋 문제 분류
          문제들은 다음과 같은 알고리즘 유형으로 분류됩니다:

          * 구현 (Implementation)
          * 자료구조 (Data Structure)
          * 정렬 (Sorting)
          * 그래프 이론 (Graph)
          * 그리디 알고리즘 (Greedy)
          * 다이나믹 프로그래밍 (Dynamic Programming)
          * 이분 탐색 (Binary Search)
          * BFS/DFS
          * 브루트포스 (Brute Force)
          * 시뮬레이션 (Simulation)

          ## 💻 사용 언어
          * Python

          ## 🔍 풀이 방법
          각 문제 폴더에는 다음 내용이 포함됩니다:

          1. 소스 코드 파일
          2. 문제 설명 (선택 사항)
          3. 접근 방법 및 알고리즘 설명 (선택 사항)
          4. 시간 복잡도 및 공간 복잡도 분석 (선택 사항)

          ![알고리즘 공부](https://github.com/user-attachments/assets/69600399-5107-4edd-87aa-74b02de454e0)
          EOL

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          
          git add README.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Update README with solved.ac statistics and complete content"
          git push --force
